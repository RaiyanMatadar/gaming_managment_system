<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#415F91"/>
      <stop offset="50%" stop-color="#284777"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AAC7FF"/>
      <stop offset="50%" stop-color="#DDBCE0"/>
      <stop offset="100%" stop-color="#9CD67D"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <polygon points="100,10 185,55 185,145 100,190 15,145 15,55" fill="url(#shieldGrad)" stroke="url(#cyberNeon)" stroke-width="3" filter="url(#logoGlow)"/>

  <!-- Inner Cyber Contour -->
  <polygon points="100,24 170,62 170,138 100,176 30,138 30,62" fill="#111318" stroke="#AAC7FF" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Gamepad / Crosshairs Icon -->
  <g transform="translate(60, 60)">
    <!-- Gamepad Body -->
    <path d="M 15 25 C 10 38 5 62 15 72 C 22 78 35 72 45 55 C 50 48 65 48 70 55 C 80 72 93 78 100 72 C 110 62 105 38 100 25 C 90 12 25 12 15 25 Z" fill="#284777" stroke="#AAC7FF" stroke-width="2"/>
    <!-- D-Pad -->
    <rect x="26" y="32" width="6" height="16" rx="1.5" fill="#AAC7FF"/>
    <rect x="21" y="37" width="16" height="6" rx="1.5" fill="#AAC7FF"/>
    <!-- Action Buttons -->
    <circle cx="85" cy="35" r="3" fill="#9CD67D"/>
    <circle cx="91" cy="41" r="3" fill="#FABD00"/>
    <circle cx="79" cy="41" r="3" fill="#FFB4AB"/>
    <circle cx="85" cy="47" r="3" fill="#DDBCE0"/>
    <!-- Center Gaming Dash Pulse -->
    <path d="M 46 41 L 52 41 L 55 35 L 59 47 L 62 41 L 68 41" fill="none" stroke="#AAC7FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Accent Cyber Dots -->
  <circle cx="100" cy="165" r="3" fill="#9CD67D"/>
  <circle cx="85" cy="165" r="2" fill="#AAC7FF"/>
  <circle cx="115" cy="165" r="2" fill="#AAC7FF"/>
</svg>
